name: Build Android APK (teste)

# Gera um APK de TESTE do Controle de Viagens.
# Ele é instalado AO LADO do app oficial (pacote ".teste" e nome "Viagens TESTE"),
# então dá para testar sem mexer no app que já está no celular.
# A versão final para os usuários deve ser gerada pela Emergent/EAS com a
# mesma assinatura do app oficial.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # publicar a Release que o app usa para se atualizar
    env:
      # Chave do Gemini que vem embutida no app (segredo do repositório).
      EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar package.json e app.json (versão de teste)
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            delete pkg.scripts.preinstall;
            delete pkg.packageManager;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            const app = JSON.parse(fs.readFileSync("app.json"));
            app.expo.name = "Viagens TESTE";
            app.expo.android.package = app.expo.android.package + ".teste";
            app.expo.ios.bundleIdentifier = app.expo.ios.bundleIdentifier + ".teste";
            // Esquema próprio: senão o retorno do login Google abre o app oficial.
            app.expo.scheme = "frontendteste";
            delete app.expo.extra.eas;
            // Número do build: o app compara com a última Release para
            // saber se há atualização (Cadastros → Procurar atualização).
            const n = Number(process.env.GITHUB_RUN_NUMBER || 0);
            app.expo.extra.buildNumber = n;
            app.expo.android.versionCode = n;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verificar tipos (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install --clean

      # Assina com a chave de release própria (Secrets do GitHub), e não com a
      # chave de teste pública do Expo — o Play Protect bloqueava o APK por isso.
      # Sem a chave o build para, para nunca publicar um APK com outra assinatura
      # (o Android recusaria instalar por cima).
      - name: Configurar assinatura de release
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os Secrets ANDROID_KEYSTORE_BASE64 e/ou ANDROID_KEYSTORE_PASSWORD (veja o README)."
            exit 1
          fi
          # Tira espaços e quebras de linha que vêm ao colar no celular.
          KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \n\r\t')
          echo "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > android/app/release.jks
          # Confere a senha já aqui, antes dos ~17 min de compilação.
          keytool -list -keystore android/app/release.jks -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" > /dev/null \
            || { echo "::error::Senha da chave errada: confira o Secret ANDROID_KEYSTORE_PASSWORD (deve ser igual ao senha-chave.txt)"; exit 1; }
          {
            echo ""
            echo "EMPRESAS_STORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> android/gradle.properties
          if [ -f android/app/build.gradle.kts ]; then
          cat >> android/app/build.gradle.kts <<'EOF'

          // Assinatura de release (adicionada pelo build.yml)
          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("release.jks")
                      storeType = "pkcs12"
                      storePassword = project.property("EMPRESAS_STORE_PASSWORD") as String
                      keyAlias = "empresasparks"
                      keyPassword = project.property("EMPRESAS_STORE_PASSWORD") as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          EOF
          else
          cat >> android/app/build.gradle <<'EOF'

          // Assinatura de release (adicionada pelo build.yml)
          android {
              signingConfigs {
                  release {
                      storeFile file("release.jks")
                      storeType "pkcs12"
                      storePassword EMPRESAS_STORE_PASSWORD
                      keyAlias "empresasparks"
                      keyPassword EMPRESAS_STORE_PASSWORD
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          fi

      - name: Compilar APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # O APK sai só com assinatura v2/v3, que o keytool não lê: usa o apksigner do SDK.
      - name: Conferir assinatura do APK
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee /tmp/certs.txt
          grep -q "CN=Luiz Alberto Cardoso" /tmp/certs.txt \
            || { echo "::error::APK não foi assinado com a chave de release"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: controle-viagens-teste-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk

      # Publica o APK numa Release (build-<número>). O app procura a última
      # Release para avisar que há atualização e instalar com 1 toque.
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ControleViagens-teste.apk
          TAG="build-${GITHUB_RUN_NUMBER}"
          VER=$(node -p 'require("./app.json").expo.version')
          gh release create "$TAG" ControleViagens-teste.apk \
            --repo "$GITHUB_REPOSITORY" --title "Controle de Viagens (teste) ${VER}" \
            --notes "APK de teste. Veja as novidades no README." --latest
