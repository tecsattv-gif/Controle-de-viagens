name: Build Android APK (teste)

# Gera um APK de TESTE do Controle de Viagens.
# Ele é instalado AO LADO do app oficial (pacote ".teste" e nome "Viagens TESTE"),
# então dá para testar sem mexer no app que já está no celular.
# A versão final para os usuários deve ser gerada pela Emergent/EAS com a
# mesma assinatura do app oficial.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Chave do Gemini que vem embutida no app (segredo do repositório).
      EXPO_PUBLIC_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar package.json e app.json (versão de teste)
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json"));
            delete pkg.scripts.preinstall;
            delete pkg.packageManager;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            const app = JSON.parse(fs.readFileSync("app.json"));
            app.expo.name = "Viagens TESTE";
            app.expo.android.package = app.expo.android.package + ".teste";
            app.expo.ios.bundleIdentifier = app.expo.ios.bundleIdentifier + ".teste";
            // Esquema próprio: senão o retorno do login Google abre o app oficial.
            app.expo.scheme = "frontendteste";
            delete app.expo.extra.eas;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Instalar dependências
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verificar tipos (TypeScript)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: controle-viagens-teste-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
